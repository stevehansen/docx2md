name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build Docx2Md.sln --configuration Release

    - name: Test
      run: dotnet test Docx2Md.sln --no-build --configuration Release
